<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renewable Power Dashboard</title>
  <meta name="robots" content="noindex">
  <!-- Any unknown path under /dashboard/ (old bookmarks) goes to the dashboard, keeping the query. -->
  <script>window.location.replace('/dashboard/' + window.location.search + window.location.hash);</script>
  <meta http-equiv="refresh" content="0; url=/dashboard/">
</head>
<body>
  <p><a href="/dashboard/">Continue to the dashboard</a></p>
</body>
</html>
